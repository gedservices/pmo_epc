{% extends "base/base.html" %}


{% block content %}

<div class="container-fluid py-3">

    {% include "base/components/cards/section_title.html" with title="Planning Gantt" subtitle="Visualisation du planning des tâches" icon="bi-calendar3" %}

    <div class="card shadow-sm mb-3">

        <div class="card-body">

            <form method="get">

                <div class="row align-items-end">

                    <div class="col-md-4">

                        <label class="form-label">

                            Projet

                        </label>

                        <select name="projet"
                                class="form-select"
                                onchange="this.form.submit()">

                            <option value="">

                                Tous les projets

                            </option>

                            {% for p in projets %}

                            <option value="{{ p.pk }}"
                                    {% if projet_id == p.pk|stringformat:"s" %}selected{% endif %}>

                                {{ p.nom }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div id="gantt_here"
                 style="width:100%;height:700px;"></div>

        </div>

    </div>

</div>

{% endblock %}



{% block extra_css %}

<link rel="stylesheet"
      href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css">

{% endblock %}



{% block extra_js %}

<script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>

<script>

gantt.config.date_format = "%d-%m-%Y";

gantt.config.scale_height = 60;

gantt.config.row_height = 34;

gantt.config.open_tree_initially = true;

gantt.config.grid_resize = true;

gantt.config.autosize = "y";

gantt.init("gantt_here");

gantt.load("{% url 'tasks:gantt_data' %}?projet={{ projet_id }}","json");

</script>

{% endblock %}
