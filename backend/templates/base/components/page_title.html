<div class="d-flex justify-content-between align-items-center mb-3">

        <h1 class="h3 mb-1">

            {% endif %}

        </h1>


        {% if page_subtitle %}

        <div class="text-muted">

            {{ page_subtitle }}

        </div>

        {% endif %}


    </div>


    {% block page_actions %}

    {% endblock %}


</div>
