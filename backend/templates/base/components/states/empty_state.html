<div class="card shadow-sm">

    <div class="card-body text-center py-5">

        <i class="bi {{ icon|default:'bi-folder2-open' }} display-4 text-muted"></i>

        <h5 class="mt-3">
            {{ title|default:"Aucun élément" }}
        </h5>

        {% if subtitle %}
        <p class="text-muted mb-4">
            {{ subtitle }}
        </p>
        {% endif %}

        {% if action_url %}
        <a href="{{ action_url }}" class="btn btn-primary">
            {% if action_icon %}
            <i class="bi {{ action_icon }}"></i>
            {% endif %}
            {{ action_label|default:"Créer" }}
        </a>
        {% endif %}

    </div>

</div>
