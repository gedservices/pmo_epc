{% if filters %}

<form method="get" class="row g-3 mb-3">

    {% for field in filters %}

    <div class="col-auto">

        <label class="form-label small mb-1">
            {{ field.label }}
        </label>

        {{ field }}

    </div>

    {% endfor %}

    <div class="col-auto align-self-end">

        <button class="btn btn-primary">
            <i class="bi bi-funnel"></i>
            Filtrer
        </button>

    </div>

</form>

{% endif %}
