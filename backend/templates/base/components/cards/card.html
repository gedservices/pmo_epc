
<div class="card shadow-sm h-100">

    {% if header %}

    <div class="card-header">

        {{ header }}

    </div>

    {% endif %}

    <div class="card-body">

        {% block card_body %}
        {% endblock %}

    </div>

    {% if footer %}

    <div class="card-footer">

        {{ footer }}

    </div>

    {% endif %}

</div>
