<div class="{{ col|default:'mb-3' }}">

    <label class="form-label">

        {{ field.label }}

    </label>

    <div class="input-group">

        {{ field }}

        <span class="input-group-text">

            €

        </span>

    </div>

    {% if field.errors %}

    <div class="text-danger small mt-1">

        {{ field.errors }}

    </div>

    {% endif %}

</div>
