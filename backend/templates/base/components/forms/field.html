<!--<div class="{{ col|default:'mb-3' }}">-->
<div class="{{ col|default:'col-md-6 mb-3' }}">

    {% if field.label %}

    <label for="{{ field.id_for_label }}"
           class="form-label">

        {{ field.label }}

        {% if field.field.required %}
        <span class="text-danger">*</span>
        {% endif %}

    </label>

    {% endif %}

    {{ field }}

    {% if field.help_text %}

    <div class="form-text">

        {{ field.help_text }}

    </div>

    {% endif %}

    {% if field.errors %}

    <div class="text-danger small mt-1">

        {{ field.errors }}

    </div>

    {% endif %}

</div>
