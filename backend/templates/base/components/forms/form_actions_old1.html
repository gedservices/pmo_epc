<div class="d-flex justify-content-end gap-2 mt-4">

    <a href="{{ cancel_url }}"
       class="btn btn-outline-secondary">

        <i class="bi bi-x-circle"></i>

        Annuler

    </a>

    <button type="submit"
            class="btn btn-primary">

        <i class="bi bi-check-circle"></i>

        {% if submit_label %}

            {{ submit_label }}

        {% else %}

            Enregistrer

        {% endif %}

    </button>

</div>
