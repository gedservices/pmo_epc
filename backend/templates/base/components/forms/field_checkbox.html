<div class="{{ col|default:'mb-3' }}">

    <div class="form-check">

        {{ field }}

        <label class="form-check-label"
               for="{{ field.id_for_label }}">

            {{ field.label }}

        </label>

    </div>

    {% if field.help_text %}

    <div class="form-text">

        {{ field.help_text }}

    </div>

    {% endif %}

    {% if field.errors %}

    <div class="text-danger small">

        {{ field.errors }}

    </div>

    {% endif %}

</div>
