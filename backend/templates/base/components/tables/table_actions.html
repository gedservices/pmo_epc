<div class="btn-group btn-group-sm">


    {% if detail_url %}

    <a href="{{ detail_url }}"
       class="btn btn-outline-primary"
       title="Voir">

        <i class="bi bi-eye"></i>

    </a>

    {% endif %}



    {% if edit_url %}

    <a href="{{ edit_url }}"
       class="btn btn-outline-warning"
       title="Modifier">

        <i class="bi bi-pencil"></i>

    </a>

    {% endif %}



    {% if delete_url %}

    <a href="{{ delete_url }}"
       class="btn btn-outline-danger"
       title="Supprimer">

        <i class="bi bi-trash"></i>

    </a>

    {% endif %}


</div>
